<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 D · 票券风</title>
<style>
/* ===== 票券风：朱红头 + 米白画布 + 白票券（撕票线 / 打孔缺口 / 大金额票根） ===== */
:root{
  --red:#E0472A; --red-deep:#C23517; --red-soft:#FCEDE8; --red-line:#F3C9BC;
  --canvas:#FAF6EF; --paper:#FFFFFF; --ink:#33241A; --mute:#94836F;
  --line:#EBDFCE; --line-strong:#E0CDB4;
  --sh1:0 1px 2px rgba(120,80,40,.06),0 2px 8px rgba(120,80,40,.05);
  --sh2:0 10px 30px rgba(150,80,40,.12),0 2px 6px rgba(150,80,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--canvas);color:var(--ink);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
.num{font-feature-settings:"tnum";letter-spacing:-.02em}
/* ===== 朱红票务头 ===== */
.head{background:linear-gradient(160deg,#E24A2B,#C23517);color:#fff;
  border-bottom:4px solid #A82C10}
.head-row{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 24px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-weight:700;font-size:17px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:#fff;color:var(--red);
  display:grid;place-items:center;font-weight:900;font-size:17px;transform:rotate(-8deg);
  box-shadow:0 2px 6px rgba(0,0,0,.18)}
.brand em{font-style:normal;font-weight:400;font-size:13px;opacity:.85}
.head-search{flex:1;max-width:520px;margin:0 auto;position:relative;min-width:0}
.head-search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  fill:none;stroke:#B08A70;stroke-width:2}
.search-input{width:100%;height:40px;padding:0 14px 0 36px;border:1px solid var(--line-strong);border-radius:999px;
  background:#fff;color:var(--ink);font-size:14px;outline:none;transition:box-shadow .15s}
.search-input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.ghost{flex:0 0 auto;height:36px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.55);
  background:transparent;color:#fff;font-size:14px;cursor:pointer;transition:background .15s}
.ghost:hover{background:rgba(255,255,255,.14)}
/* ===== 工具条 ===== */
.subbar{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:22px 24px 4px;flex-wrap:wrap}
.count{font-size:13px;color:var(--mute)}
.count b{color:var(--red-deep);font-weight:700}
.sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.sort select{height:34px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;
  color:var(--ink);padding:0 10px;font-size:13px;outline:none}
/* ===== 分类票券卡 ===== */
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:16px;padding:18px 24px 64px}
@media(min-width:1240px){.grid{grid-template-columns:repeat(4,minmax(270px,1fr))}}
@media(min-width:1540px){.grid{grid-template-columns:repeat(5,minmax(270px,1fr));max-width:1500px}}
.cat-card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px 16px;min-height:126px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;
  display:flex;flex-direction:column;gap:0;box-shadow:var(--sh1);
  transition:box-shadow .18s,transform .18s}
.cat-card:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.cat-card:active{transform:translateY(0)}
/* 打孔缺口（骑在撕票线上） */
.cat-card::before,.cat-card::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;
  background:var(--canvas);top:66px}
.cat-card::before{left:-10px}.cat-card::after{right:-10px}
.cat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:12px}
.cat-name{font-weight:700;font-size:16px;line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-count{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--red-deep);
  background:var(--red-soft);border:1px solid var(--red-line);padding:3px 8px;border-radius:999px;white-space:nowrap}
.cat-tear{border-top:2px dashed var(--line-strong);margin:0 -20px}
.cat-deal{display:flex;align-items:baseline;gap:6px;padding-top:11px;font-size:12.5px;color:var(--mute)}
.cat-deal b{margin-left:auto;font-size:24px;font-weight:800;color:var(--red);
  font-feature-settings:"tnum";letter-spacing:-.03em;line-height:1}
.cat-deal .u{font-size:13px;font-weight:700;color:var(--red)}
/* ===== 弹窗 ===== */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.mask{position:absolute;inset:0;background:rgba(60,30,15,.45);animation:fade .2s}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(660px,calc(100vw - 28px));
  max-height:86vh;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);
  display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.2,.8,.3,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:560px){.panel{left:0;top:auto;bottom:0;transform:none;width:100%;border-radius:18px 18px 0 0}}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 12px}
.m-head h2{font-size:19px;font-weight:800}
.m-sub{font-size:12.5px;color:var(--mute)}
.m-close{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-size:15px;color:var(--mute)}
.m-tools{padding:0 22px 14px}
.m-tools .search-input{border-radius:10px;height:40px}
.m-body{overflow-y:auto;padding:14px 18px 20px;display:flex;flex-direction:column;gap:12px;background:var(--canvas)}
/* ===== 券票根条 ===== */
.coupon{position:relative;display:flex;align-items:stretch;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:box-shadow .15s,transform .15s}
.coupon:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.coupon::before,.coupon::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;
  background:var(--canvas);top:calc(50% - 8px);z-index:2}
.coupon::before{left:-9px}.coupon::after{right:-9px}
.stub{flex:0 0 auto;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;background:var(--red-soft);border-right:2px dashed var(--red-line);padding:12px 6px}
.stub .s1{font-size:11px;color:var(--red-deep)}
.stub .s2{font-size:24px;font-weight:800;color:var(--red);line-height:1;font-feature-settings:"tnum";letter-spacing:-.03em}
.stub .s3{font-size:10.5px;color:var(--mute);margin-top:3px}
.c-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center;padding:12px 14px}
.coupon-brand{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coupon-name{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;border-radius:99px;background:#F1E7D8;margin-top:5px;overflow:hidden;max-width:180px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--red)}
.prog.low i{background:#C23517}
.prog-cap{font-size:10.5px;color:var(--mute);font-feature-settings:"tnum"}
.coupon-mid{flex:0 1 auto;min-width:0;align-self:center;font-size:12px;color:var(--mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
@media(max-width:640px){.coupon-mid{display:none}}
.cta{flex:0 0 auto;align-self:center;margin-right:14px;background:var(--red);color:#fff;
  padding:9px 18px;border-radius:999px;font-size:14px;font-weight:700;transition:background .15s}
.cta:hover{background:var(--red-deep)}
.m-empty{text-align:center;color:var(--mute);padding:36px;font-size:14px}
/* ===== 页脚 ===== */
.foot{border-top:2px dashed var(--line-strong);margin-top:8px}
.foot-inner{max-width:1200px;margin:0 auto;padding:32px 24px 40px;font-size:13px;color:var(--mute);line-height:1.8}
.foot-inner h2{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px}
.foot-repo{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.foot-repo a{color:var(--red-deep);font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="head">
  <div class="head-row">
    <div class="brand"><span class="brand-mark">券</span>立创商城<em>优惠券助手</em></div>
    <div class="head-search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="search-input" id="search" type="search" placeholder="搜分类、品牌或券名，如 电阻 / MPS / 满减" autocomplete="off">
    </div>
    <button class="ghost" onclick="document.getElementById('guide').scrollIntoView({behavior:'smooth'})">使用说明</button>
  </div>
</header>
<div class="subbar">
  <span class="count">共 <b id="catN">—</b> 个分类 · <b id="cpnN">—</b> 张券 · 更新于 <b class="num">2026-10-23 07:30</b></span>
  <span class="sort">排序
    <select id="sortKey"><option value="deal">最高优惠</option><option value="recv">领取热度</option></select>
  </span>
</div>
<main class="grid" id="grid"></main>
<div class="modal" id="modal">
  <div class="mask" onclick="closeModal()"></div>
  <div class="panel">
    <div class="m-head"><div><h2 id="mTitle">分类</h2><span class="m-sub" id="mSub"></span></div>
      <button class="m-close" onclick="closeModal()">✕</button></div>
    <div class="m-tools"><input class="search-input" id="mSearch" type="search" placeholder="在本分类内搜品牌 / 券名" autocomplete="off"></div>
    <div class="m-body" id="mBody"></div>
  </div>
</div>
<footer class="foot" id="guide">
  <div class="foot-inner">
    <h2>使用指南</h2>
    <p>点击分类卡片查看该分类下全部品牌优惠券，点击券条跳转立创商城品牌页面领取。各品牌券数量有限、领完即止，使用规则以官方页面为准。</p>
    <p class="foot-repo">开源项目：<a href="https://github.com/shawn996/szlcsc-help" target="_blank" rel="noopener">github.com/shawn996/szlcsc-help</a>，欢迎 Issue / PR。</p>
  </div>
</footer>
<script>
const DATA={
'EEPROM':[{b:'HK(航顺)',n:'品牌满减券',m:51,a:50,r:3120,t:3500},{b:'Puya(普冉)',n:'品牌满减券',m:31,a:30,r:1204,t:2000}],
'LCD驱动':[{b:'GT(格特)',n:'显示驱动满减券',m:21,a:20,r:890,t:1500},{b:'SITRONIX',n:'品牌满减券',m:16,a:15,r:430,t:800}],
'NOR FLASH':[{b:'GD(兆易创新)',n:'存储满减券',m:51,a:50,r:2201,t:2500},{b:'XMC(武汉新芯)',n:'品牌满减券',m:21,a:20,r:512,t:900},{b:'DOBY(东芯)',n:'品牌满减券',m:16,a:15,r:96,t:600}],
'单片机(MCU/MPU/SOC)':[{b:'ST(意法半导体)',n:'MCU满减券',m:51,a:50,r:5210,t:6000},{b:'GD(兆易创新)',n:'MCU品牌券',m:31,a:30,r:1890,t:3000},{b:'CH(南京沁恒)',n:'品牌满减券',m:21,a:20,r:920,t:1200},{b:'WCH(南京沁恒)',n:'USB MCU券',m:16,a:15,r:640,t:1000}],
'开发板':[{b:'正点原子',n:'开发板满减券',m:101,a:100,r:780,t:1000},{b:'野火',n:'品牌满减券',m:51,a:50,r:410,t:800},{b:'ST(意法半导体)',n:'Nucleo券',m:51,a:50,r:330,t:500}],
'电阻':[{b:'YAGEO(国巨)',n:'阻容满减券',m:16,a:15,r:4120,t:5000},{b:'UNI-ROHM',n:'品牌满减券',m:16,a:15,r:1620,t:3000},{b:'厚声',n:'品牌满减券',m:16,a:15,r:980,t:2000}],
'电容':[{b:'Murata(村田)',n:'MLCC满减券',m:16,a:15,r:3890,t:5000},{b:'Samsung(三星电机)',n:'品牌满减券',m:16,a:15,r:1450,t:2500},{b:'艾华',n:'铝电解券',m:21,a:20,r:760,t:1500}],
'连接器':[{b:'TE(泰科)',n:'连接器满减券',m:51,a:50,r:1120,t:2000},{b:'JST(日压)',n:'品牌满减券',m:21,a:20,r:520,t:1000},{b:'广宇',n:'品牌满减券',m:16,a:15,r:210,t:600}],
'电源芯片':[{b:'MPS(芯源系统)',n:'电源满减券',m:51,a:50,r:2980,t:3500},{b:'TI(德州仪器)',n:'品牌满减券',m:51,a:50,r:2410,t:3000},{b:'SCT(矽力杰)',n:'DCDC券',m:31,a:30,r:830,t:1500}]};
let cur=null,q='',sortKey='deal';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number.isInteger(+n)?+n:(+n).toFixed(1).replace(/\.0$/,'');
function catDeal(l){return Math.max(...l.map(c=>c.a))}
function catRecv(l){return l.reduce((s,c)=>s+c.r,0)}
function renderGrid(){
  const arr=Object.entries(DATA).map(([name,list])=>{const top=list.slice().sort((a,b)=>b.a-a.a)[0];return{name,list,d:top.a,m:top.m,v:catRecv(list)}});
  arr.sort((a,b)=>sortKey==='recv'?b.v-a.v:b.d-a.d);
  $('grid').innerHTML=arr.map(c=>`<button class="cat-card" onclick="openCat('${esc(c.name)}')">
    <div class="cat-top"><span class="cat-name">${esc(c.name)}</span><span class="cat-count">${c.list.length} 张</span></div>
    <div class="cat-tear"></div>
    <div class="cat-deal">最高优惠<span class="u num">¥</span><b class="num">${fmt(c.d)}</b><span>满${fmt(c.m)}可用</span></div></button>`).join('');
  $('catN').textContent=arr.length;$('cpnN').textContent=arr.reduce((s,c)=>s+c.list.length,0);
}
function couponRow(c,cats){
  const left=c.t-c.r,low=left<=c.t*.2,pct=Math.min(100,Math.round(c.r/c.t*100));
  return `<a class="coupon" href="https://list.szlcsc.com/brand/832.html" target="_blank" rel="noopener">
    <div class="stub"><span class="s1">满${fmt(c.m)}减</span><span class="s2 num">${fmt(c.a)}</span><span class="s3">品牌专享</span></div>
    <div class="c-main"><span class="coupon-brand">${esc(c.b)}</span><span class="coupon-name">${esc(c.n)}</span>
      <div class="prog${low?' low':''}"><i style="width:${pct}%"></i></div>
      <span class="prog-cap num">已领 ${fmt(c.r)}/${fmt(c.t)}${low?` · 仅剩 ${fmt(left)}`:''}</span></div>
    ${cats?`<span class="coupon-mid" title="所属分类：${esc(cats.join('、'))}">${esc(cats.length>3?cats.slice(0,3).join('、')+' 等'+cats.length+'个分类':cats.join('、'))}</span>`:''}
    <span class="cta">领券</span></a>`;
}
function openCat(name){
  cur=name;q='';$('mSearch').value='';
  $('mTitle').textContent=name;$('mSub').textContent=DATA[name].length+' 张品牌券';
  $('modal').classList.add('open');document.body.style.overflow='hidden';
  const tools=document.querySelector('.m-tools');tools.style.display=DATA[name].length<8?'none':'';
  renderCat();$('mSearch').focus();
}
function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}
function renderCat(){
  let l=DATA[cur].slice();
  if(q)l=l.filter(c=>c.b.toLowerCase().includes(q)||c.n.toLowerCase().includes(q));
  l.sort((a,b)=>sortKey==='recv'?b.r-a.r:b.a-a.a);
  $('mBody').innerHTML=l.length?l.map(c=>couponRow(c)).join(''):'<div class="m-empty">本分类内没有匹配的券</div>';
}
$('search').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){$('grid').classList.remove('flat');renderGrid();return}
  const seen=new Map();
  for(const[cat,list]of Object.entries(DATA)){
    const hit=cat.toLowerCase().includes(v);
    for(const c of (hit?list:list.filter(c=>c.b.toLowerCase().includes(v)||c.n.toLowerCase().includes(v)))){
      const k=c.b+c.n+c.m+c.a;
      if(!seen.has(k))seen.set(k,{c,cats:[cat]});
      else if(!seen.get(k).cats.includes(cat)){hit?seen.get(k).cats.unshift(cat):seen.get(k).cats.push(cat)}
    }
  }
  const arr=[...seen.values()];
  arr.sort((a,b)=>sortKey==='recv'?b.c.r-a.c.r:b.c.a-a.c.a);
  $('grid').style.display='block';
  $('grid').innerHTML=arr.length?arr.map(it=>couponRow(it.c,it.cats)).join(''):'<div class="m-empty">没有匹配的优惠券</div>';
});
$('mSearch').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderCat()});
$('sortKey').addEventListener('change',e=>{sortKey=e.target.value;renderGrid();if(cur)renderCat()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderGrid();
</script>
</body>
</html>
