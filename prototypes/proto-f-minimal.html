<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>方向F · 极简清单风 · 立创优惠券</title>
<style>
:root{--brand:#2B6CFF;--bg:#FBFCFD;--surface:#FFFFFF;--text:#20293A;--muted:#8B94A5;
  --border:#E9EDF2;--hover:#F3F6FA}
@media(prefers-color-scheme:dark){:root{--bg:#0E1319;--surface:#151C26;--text:#E6EDF4;--muted:#8D9AAB;--border:#232D3B;--hover:#1A2330}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 80px}
.head{padding:44px 0 6px}
.head h1{font-size:22px;font-weight:800;letter-spacing:.3px}
.head p{font-size:13px;color:var(--muted);margin-top:5px}
.searchrow{margin:20px 0 6px;position:relative}
.searchrow svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search{width:100%;height:44px;border:1px solid var(--border);border-radius:12px;
  padding:0 14px 0 40px;font-size:14.5px;background:var(--surface);color:var(--text);outline:none;
  transition:border-color .15s,box-shadow .15s}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(43,108,255,.10)}
.tabs{display:flex;gap:20px;overflow-x:auto;border-bottom:1px solid var(--border);
  margin-top:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:none;border-bottom:2px solid transparent;
  padding:11px 2px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:color .15s}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.group{margin-top:28px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.group-h h2{font-size:14.5px;font-weight:700}
.group-h span{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 10px;margin:0 -10px;border-radius:10px;transition:background .13s}
.row:hover{background:var(--hover)}
.r-l{min-width:0}
.r-brand{font-size:15px;font-weight:600}
.r-name{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.r-r{flex:0 0 auto;text-align:right}
.r-deal{font-size:14.5px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.r-sub{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.r-go{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--brand);text-decoration:none;
  padding:7px 13px;border:1px solid var(--border);border-radius:8px;transition:.15s}
.r-go:hover{border-color:var(--brand);background:var(--brand);color:#fff}
@media(max-width:480px){.r-name{display:none}}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>立创优惠券</h1>
    <p id="sub">加载中…</p>
  </header>
  <div class="searchrow">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input class="search" id="q" placeholder="搜索品牌、券名或分类…" autocomplete="off">
  </div>
  <nav class="tabs" id="tabs"></nav>
  <main id="list"></main>
</div>
<script src="sample_data.js"></script>
<script>
const D = window.SAMPLE_DATA;
const fmt = n => Number.isInteger(n) ? n : Number(n).toFixed(1);
let tab = '全部', q = '';
const cats = Object.keys(D.categories);
const tabsBox = document.getElementById('tabs');
tabsBox.innerHTML = ['全部', ...cats].map(c =>
  `<button class="tab${c==='全部'?' on':''}" data-c="${c}">${c}</button>`).join('');
tabsBox.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  tab = b.dataset.c;
  tabsBox.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sub').textContent = `共 ${D.totalCoupons} 张券 · ${D.totalCats} 个分类 · 更新于 ${D.runTime}`;
const matchQ = x => !q || (x.brand_name||'').toLowerCase().includes(q)
  || (x.coupon_name||'').toLowerCase().includes(q);
function render(){
  const show = tab === '全部' ? cats : [tab];
  let html = '', total = 0;
  for (const c of show) {
    const items = (D.categories[c] || []).filter(matchQ)
      .slice().sort((a,b) => b.receive_customer_num - a.receive_customer_num);
    if (!items.length) continue;
    total += items.length;
    html += `<section class="group">
      <div class="group-h"><h2>${c}</h2><span>${items.length} 张</span></div>
      ${items.map(x => `
      <div class="row">
        <div class="r-l">
          <div class="r-brand">${x.brand_name}</div>
          <div class="r-name">${x.coupon_name}</div>
        </div>
        <div class="r-r">
          <div class="r-deal">满${fmt(x.min_order_amount)}减${fmt(x.coupon_amount)}</div>
          <div class="r-sub">优惠后 ¥${fmt(x.min_order_after_discount)}</div>
        </div>
        <a class="r-go" target="_blank" rel="noopener" href="https://list.szlcsc.com/brand/${x.brand_id}.html">领取</a>
      </div>`).join('')}
    </section>`;
  }
  document.getElementById('list').innerHTML = html ||
    '<div class="empty">没有匹配的券，换个关键词试试</div>';
}
render();
</script>
</body>
</html>
