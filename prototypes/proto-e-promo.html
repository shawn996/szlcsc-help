<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>方向E · 领券中心风 · 立创优惠券</title>
<style>
:root{--brand:#2B6CFF;--accent1:#FF7A45;--accent2:#FF4D4F;
  --bg:#F4F6FB;--surface:#FFFFFF;--text:#1C2333;--muted:#7A8494;--border:#E8ECF3}
@media(prefers-color-scheme:dark){:root{--bg:#0F141C;--surface:#1A212D;--text:#E8EDF4;--muted:#93A0B3;--border:#2A3342}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.banner{background:linear-gradient(135deg,#2B6CFF,#5B8CFF 55%,#7EA8FF);color:#fff;
  padding:26px 18px 52px;position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.10)}
.banner::after{content:"";position:absolute;right:70px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.banner h1{font-size:22px;font-weight:800;letter-spacing:.5px;position:relative}
.banner p{font-size:12.5px;opacity:.88;margin-top:4px;position:relative}
.searchwrap{max-width:760px;margin:-30px auto 0;padding:0 16px;position:relative;z-index:2}
.search{width:100%;height:48px;border:none;border-radius:999px;padding:0 20px;font-size:15px;
  background:var(--surface);color:var(--text);box-shadow:0 8px 24px rgba(20,40,90,.16);outline:none}
.search::placeholder{color:var(--muted)}
.chips{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;
  overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.meta{max-width:960px;margin:0 auto;padding:2px 18px 10px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--text)}
.grid{max-width:960px;margin:0 auto;padding:6px 16px 70px;display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.ticket{display:flex;background:var(--surface);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 10px rgba(20,40,90,.07);transition:transform .18s,box-shadow .18s}
.ticket:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,40,90,.14)}
.tk-left{flex:0 0 106px;background:linear-gradient(150deg,var(--accent1),var(--accent2));color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  position:relative;padding:10px 4px;text-align:center}
.tk-left::before,.tk-left::after{content:"";position:absolute;right:-7px;width:14px;height:14px;
  border-radius:50%;background:var(--bg);z-index:1}
.tk-left::before{top:-7px}.tk-left::after{bottom:-7px}
.tk-amt{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tk-amt i{font-style:normal;font-size:13px;font-weight:700;margin-right:1px}
.tk-cond{font-size:11px;opacity:.92}
.tk-right{flex:1;min-width:0;padding:11px 12px 10px;display:flex;flex-direction:column;gap:5px;
  border-left:1px dashed var(--border)}
.tk-brand{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.tk-recv{font-size:11px;color:var(--muted)}
.cta{flex:0 0 auto;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;
  text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;transition:.15s}
.cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}
</style>
</head>
<body>
<header class="banner">
  <h1>立创优惠券</h1>
  <p id="sub">加载中…</p>
</header>
<div class="searchwrap"><input class="search" id="q" placeholder="搜索品牌 / 券名 / 分类，如 MPS、电阻" autocomplete="off"></div>
<nav class="chips" id="chips"></nav>
<div class="meta" id="meta"></div>
<main class="grid" id="list"></main>
<script src="sample_data.js"></script>
<script>
const D = window.SAMPLE_DATA;
const fmt = n => Number.isInteger(n) ? n : Number(n).toFixed(1);
const wan = n => n >= 10000 ? (n/10000).toFixed(1) + '万' : n;
let cat = '全部', q = '', sort = 'hot';
const chipBox = document.getElementById('chips');
const cats = ['全部', ...Object.keys(D.categories)];
chipBox.innerHTML = cats.map(c => `<button class="chip${c==='全部'?' on':''}" data-c="${c}">${c}</button>`).join('');
chipBox.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.c;
  chipBox.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sub').textContent = `共 ${D.totalCoupons} 张券 · ${D.totalCats} 个分类 · 更新于 ${D.runTime}`;
function current(){
  let l = D.flat.filter(x => cat === '全部' || x.cats.includes(cat));
  if (q) l = l.filter(x => (x.brand_name||'').toLowerCase().includes(q)
    || (x.coupon_name||'').toLowerCase().includes(q) || x.cats.join(',').toLowerCase().includes(q));
  if (sort === 'amount') l = l.slice().sort((a,b) => b.coupon_amount - a.coupon_amount);
  else if (sort === 'threshold') l = l.slice().sort((a,b) => a.min_order_after_discount - b.min_order_after_discount);
  else l = l.slice().sort((a,b) => b.receive_customer_num - a.receive_customer_num);
  return l;
}
function render(){
  const l = current();
  document.getElementById('meta').innerHTML = (q || cat !== '全部')
    ? `匹配 <b>${l.length}</b> 张券` : `已为你优选 <b>${l.length}</b> 张券`;
  document.getElementById('list').innerHTML = l.length ? l.map(x => `
    <article class="ticket">
      <div class="tk-left">
        <div class="tk-amt"><i>¥</i>${fmt(x.coupon_amount)}</div>
        <div class="tk-cond">满${fmt(x.min_order_amount)}可用</div>
      </div>
      <div class="tk-right">
        <div class="tk-brand">${x.brand_name}</div>
        <div class="tk-name">${x.coupon_name}</div>
        <div class="tk-foot">
          <span class="tk-recv">已领 ${wan(x.receive_customer_num)} 张</span>
          <a class="cta" target="_blank" rel="noopener" href="https://list.szlcsc.com/brand/${x.brand_id}.html">去领券</a>
        </div>
      </div>
    </article>`).join('') : '<div class="empty">没有匹配的券，换个关键词试试</div>';
}
render();
</script>
</body>
</html>
