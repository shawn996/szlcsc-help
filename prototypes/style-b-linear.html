<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 B · Linear 风格（深色）</title>
<style>
/* ===== Linear 令牌：#010102 深色画布 + 表面阶梯 + 薰衣草蓝单一强调 ===== */
:root{
  --primary:#5E6AD2; --primary-hover:#828FFF; --primary-focus:#5E69D1;
  --ink:#F7F8F8; --ink-muted:#D0D6E0; --ink-subtle:#8A8F98; --ink-tertiary:#62666D;
  --canvas:#010102; --s1:#0F1011; --s2:#141516; --s3:#18191A;
  --hairline:#23252A; --hairline-strong:#34343A; --success:#27A644;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--canvas);color:var(--ink);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
a{color:var(--ink);text-decoration:none}
button,input,select{font-family:inherit}
/* 顶部导航 56px，深色画布 */
.head{position:sticky;top:0;z-index:50;height:56px;background:var(--canvas);border-bottom:1px solid var(--hairline)}
.head-row{max-width:1280px;margin:0 auto;height:100%;display:flex;align-items:center;gap:16px;padding:0 24px}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;font-size:16px;font-weight:500;letter-spacing:-.02em}
.brand-mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--primary),#8A90E8);flex:0 0 auto}
.brand em{font-style:normal;color:var(--ink-subtle);font-weight:400}
.head-search{flex:1;max-width:480px;margin:0 auto;position:relative;min-width:0}
.head-search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  fill:none;stroke:var(--ink-subtle);stroke-width:2}
.search-input{width:100%;height:36px;padding:0 12px 0 33px;border:1px solid var(--hairline);border-radius:8px;
  background:var(--s1);color:var(--ink);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.search-input::placeholder{color:var(--ink-tertiary)}
.search-input:focus{border-color:var(--hairline-strong);box-shadow:0 0 0 2px rgba(94,105,209,.5)}
.ghost{flex:0 0 auto;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--hairline);
  background:var(--s1);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.ghost:hover{background:var(--s2)}
/* 工具条 */
.subbar{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:20px 24px 4px;flex-wrap:wrap}
.count{font-size:13.5px;color:var(--ink-subtle);letter-spacing:-.01em}
.count b{color:var(--ink);font-weight:500}
.sort{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-subtle)}
.sort select{height:34px;border:1px solid var(--hairline);border-radius:8px;background:var(--s1);
  color:var(--ink);padding:0 10px;font-size:13.5px;outline:none}
.sort select:focus{box-shadow:0 0 0 2px rgba(94,105,209,.5)}
/* 卡片网格：表面阶梯承载层级，无阴影 */
.grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:12px;padding:18px 24px 64px}
@media(min-width:1240px){.grid{grid-template-columns:repeat(4,minmax(270px,1fr))}}
@media(min-width:1540px){.grid{grid-template-columns:repeat(5,minmax(270px,1fr));max-width:1540px}}
.cat-card{background:var(--s1);border:1px solid var(--hairline);border-radius:12px;padding:20px;
  height:116px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;
  display:flex;flex-direction:column;gap:10px;transition:background .15s,border-color .15s}
.cat-card:hover{background:var(--s2);border-color:var(--hairline-strong)}
.cat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cat-name{font-weight:500;font-size:16px;letter-spacing:-.02em;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-count{flex:0 0 auto;font-size:12px;color:var(--ink-muted);background:var(--s2);border:1px solid var(--hairline);
  padding:2px 9px;border-radius:999px;white-space:nowrap}
.cat-deal{margin-top:auto;font-size:12.5px;color:var(--ink-subtle)}
.cat-deal b{margin-left:4px;color:var(--ink);font-weight:500;font-size:15px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
/* 弹窗 */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.7);animation:fade .2s}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 28px));
  max-height:86vh;background:var(--s1);border:1px solid var(--hairline);border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.2,.8,.3,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:560px){.panel{left:0;top:auto;bottom:0;transform:none;width:100%;border-radius:12px 12px 0 0}}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px}
.m-head h2{font-size:18px;font-weight:600;letter-spacing:-.03em}
.m-sub{font-size:12.5px;color:var(--ink-subtle)}
.m-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--hairline);background:var(--s2);
  cursor:pointer;font-size:14px;color:var(--ink-muted)}
.m-tools{padding:0 20px 14px}
.m-tools .search-input{height:38px}
.m-body{overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:8px;background:var(--canvas);
  scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
/* 券横条 */
.coupon{background:var(--s1);border:1px solid var(--hairline);border-radius:8px;padding:11px 14px;
  display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s}
.coupon:hover{border-color:var(--hairline-strong);background:var(--s2)}
.coupon-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.coupon-brand{font-weight:500;font-size:14.5px;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coupon-name{font-size:12.5px;color:var(--ink-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coupon-mid{flex:1 1 0;min-width:0;font-size:12px;color:var(--ink-subtle);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:right}
@media(max-width:640px){.coupon-mid{display:none}}
.deal{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.deal .m{font-size:13.5px;font-weight:500;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace}
.deal .s{font-size:11px;color:var(--ink-subtle);font-family:ui-monospace,"SF Mono",Menlo,monospace}
.deal .s.low{color:var(--success)}
.cta{flex:0 0 auto;background:var(--primary);color:#fff;padding:7px 14px;border-radius:8px;font-size:13.5px;
  font-weight:500;transition:background .15s}
.cta:hover{background:var(--primary-hover)}
.cta:active{background:var(--primary-focus)}
.m-empty{text-align:center;color:var(--ink-subtle);padding:36px;font-size:14px}
/* 页脚 */
.foot{border-top:1px solid var(--hairline);background:var(--canvas)}
.foot-inner{max-width:1280px;margin:0 auto;padding:32px 24px 40px;font-size:13px;color:var(--ink-subtle);line-height:1.8}
.foot-inner h2{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-bottom:8px}
.foot-inner a{color:var(--ink-muted)}
.foot-inner a:hover{color:var(--primary-hover)}
.foot-repo{margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="head">
  <div class="head-row">
    <div class="brand"><span class="brand-mark"></span>立创商城<em>优惠券助手</em></div>
    <div class="head-search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="search-input" id="search" type="search" placeholder="搜分类、品牌或券名，如 电阻 / MPS / 满减" autocomplete="off">
    </div>
    <button class="ghost" onclick="document.getElementById('guide').scrollIntoView({behavior:'smooth'})">使用说明</button>
  </div>
</header>
<div class="subbar">
  <span class="count">共 <b id="catN">—</b> 个分类 · <b id="cpnN">—</b> 张券 · 更新于 <b class="mono">2026-10-23 07:30</b></span>
  <span class="sort">排序
    <select id="sortKey"><option value="deal">最高优惠</option><option value="recv">领取热度</option></select>
  </span>
</div>
<main class="grid" id="grid"></main>
<div class="modal" id="modal">
  <div class="mask" onclick="closeModal()"></div>
  <div class="panel">
    <div class="m-head"><div><h2 id="mTitle">分类</h2><span class="m-sub" id="mSub"></span></div>
      <button class="m-close" onclick="closeModal()">✕</button></div>
    <div class="m-tools"><input class="search-input" id="mSearch" type="search" placeholder="在本分类内搜品牌 / 券名" autocomplete="off"></div>
    <div class="m-body" id="mBody"></div>
  </div>
</div>
<footer class="foot" id="guide">
  <div class="foot-inner">
    <h2>使用指南</h2>
    <p>点击分类卡片查看该分类下全部品牌优惠券，点击券条跳转立创商城品牌页面领取。各品牌券数量有限、领完即止，使用规则以官方页面为准。</p>
    <p class="foot-repo">开源项目：<a href="https://github.com/shawn996/szlcsc-help" target="_blank" rel="noopener">github.com/shawn996/szlcsc-help</a>，欢迎 Issue / PR。</p>
  </div>
</footer>
<script>
const DATA={
'EEPROM':[{b:'HK(航顺)',n:'品牌满减券',m:51,a:50,r:3120,t:3500},{b:'Puya(普冉)',n:'品牌满减券',m:31,a:30,r:1204,t:2000}],
'LCD驱动':[{b:'GT(格特)',n:'显示驱动满减券',m:21,a:20,r:890,t:1500},{b:'SITRONIX',n:'品牌满减券',m:16,a:15,r:430,t:800}],
'NOR FLASH':[{b:'GD(兆易创新)',n:'存储满减券',m:51,a:50,r:2201,t:2500},{b:'XMC(武汉新芯)',n:'品牌满减券',m:21,a:20,r:512,t:900},{b:'DOBY(东芯)',n:'品牌满减券',m:16,a:15,r:96,t:600}],
'单片机(MCU/MPU/SOC)':[{b:'ST(意法半导体)',n:'MCU满减券',m:51,a:50,r:5210,t:6000},{b:'GD(兆易创新)',n:'MCU品牌券',m:31,a:30,r:1890,t:3000},{b:'CH(南京沁恒)',n:'品牌满减券',m:21,a:20,r:920,t:1200},{b:'WCH(南京沁恒)',n:'USB MCU券',m:16,a:15,r:640,t:1000}],
'开发板':[{b:'正点原子',n:'开发板满减券',m:101,a:100,r:780,t:1000},{b:'野火',n:'品牌满减券',m:51,a:50,r:410,t:800},{b:'ST(意法半导体)',n:'Nucleo券',m:51,a:50,r:330,t:500}],
'电阻':[{b:'YAGEO(国巨)',n:'阻容满减券',m:16,a:15,r:4120,t:5000},{b:'UNI-ROHM',n:'品牌满减券',m:16,a:15,r:1620,t:3000},{b:'厚声',n:'品牌满减券',m:16,a:15,r:980,t:2000}],
'电容':[{b:'Murata(村田)',n:'MLCC满减券',m:16,a:15,r:3890,t:5000},{b:'Samsung(三星电机)',n:'品牌满减券',m:16,a:15,r:1450,t:2500},{b:'艾华',n:'铝电解券',m:21,a:20,r:760,t:1500}],
'连接器':[{b:'TE(泰科)',n:'连接器满减券',m:51,a:50,r:1120,t:2000},{b:'JST(日压)',n:'品牌满减券',m:21,a:20,r:520,t:1000},{b:'광宇(广宇)',n:'品牌满减券',m:16,a:15,r:210,t:600}],
'电源芯片':[{b:'MPS(芯源系统)',n:'电源满减券',m:51,a:50,r:2980,t:3500},{b:'TI(德州仪器)',n:'品牌满减券',m:51,a:50,r:2410,t:3000},{b:'SCT(矽力杰)',n:'DCDC券',m:31,a:30,r:830,t:1500}]};
let cur=null,q='',sortKey='deal';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number.isInteger(+n)?+n:(+n).toFixed(1).replace(/\.0$/,'');
function catDeal(l){return Math.max(...l.map(c=>c.a))}
function catRecv(l){return l.reduce((s,c)=>s+c.r,0)}
function renderGrid(){
  const arr=Object.entries(DATA).map(([name,list])=>{const top=list.slice().sort((a,b)=>b.a-a.a)[0];return{name,list,d:top.a,m:top.m,v:catRecv(list)}});
  arr.sort((a,b)=>sortKey==='recv'?b.v-a.v:b.d-a.d);
  $('grid').innerHTML=arr.map(c=>`<button class="cat-card" onclick="openCat('${esc(c.name)}')">
    <div class="cat-top"><span class="cat-name">${esc(c.name)}</span><span class="cat-count">${c.list.length} 张</span></div>
    <div class="cat-deal">最高优惠<b>满${fmt(c.m)}减${fmt(c.d)}</b></div></button>`).join('');
  $('catN').textContent=arr.length;$('cpnN').textContent=arr.reduce((s,c)=>s+c.list.length,0);
}
function couponRow(c,cats){
  const left=c.t-c.r,low=left<=c.t*.2;
  return `<a class="coupon" href="https://list.szlcsc.com/brand/832.html" target="_blank" rel="noopener">
    <div class="coupon-main"><span class="coupon-brand">${esc(c.b)}</span><span class="coupon-name">${esc(c.n)}</span></div>
    ${cats?`<span class="coupon-mid" title="所属分类：${esc(cats.join('、'))}">${esc(cats.length>3?cats.slice(0,3).join('、')+' 等'+cats.length+'个分类':cats.join('、'))}</span>`:''}
    <div class="deal"><span class="m">满${fmt(c.m)}减${fmt(c.a)}</span>
      <span class="s${low?' low':''}">已领 ${c.r}/${c.t}${low?` · 仅剩 ${left}`:''}</span></div>
    <span class="cta">领券</span></a>`;
}
function openCat(name){
  cur=name;q='';$('mSearch').value='';
  $('mTitle').textContent=name;$('mSub').textContent=DATA[name].length+' 张品牌券';
  $('modal').classList.add('open');document.body.style.overflow='hidden';
  const tools=document.querySelector('.m-tools');tools.style.display=DATA[name].length<8?'none':'';
  renderCat();$('mSearch').focus();
}
function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}
function renderCat(){
  let l=DATA[cur].slice();
  if(q)l=l.filter(c=>c.b.toLowerCase().includes(q)||c.n.toLowerCase().includes(q));
  l.sort((a,b)=>sortKey==='recv'?b.r-a.r:b.a-a.a);
  $('mBody').innerHTML=l.length?l.map(c=>couponRow(c)).join(''):'<div class="m-empty">本分类内没有匹配的券</div>';
}
$('search').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();
  const g=$('grid');
  if(!v){g.classList.remove('flat');g.style.gridTemplateColumns='';g.style.maxWidth='';renderGrid();return}
  const seen=new Map();
  for(const[cat,list]of Object.entries(DATA)){
    const hit=cat.toLowerCase().includes(v);
    for(const c of (hit?list:list.filter(c=>c.b.toLowerCase().includes(v)||c.n.toLowerCase().includes(v)))){
      const k=c.b+c.n+c.m+c.a;
      if(!seen.has(k))seen.set(k,{c,cats:[cat]});
      else if(!seen.get(k).cats.includes(cat)){hit?seen.get(k).cats.unshift(cat):seen.get(k).cats.push(cat)}
    }
  }
  const arr=[...seen.values()];
  arr.sort((a,b)=>sortKey==='recv'?b.c.r-a.c.r:b.c.a-a.c.a);
  g.classList.add('flat');g.style.gridTemplateColumns='1fr';g.style.maxWidth='1200px';
  g.innerHTML=arr.length?arr.map(it=>couponRow(it.c,it.cats)).join(''):'<div class="m-empty">没有匹配的优惠券</div>';
});
$('mSearch').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderCat()});
$('sortKey').addEventListener('change',e=>{sortKey=e.target.value;renderGrid();if(cur)renderCat()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderGrid();
</script>
</body>
</html>
