<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页分类卡片样式对比 · E 极光玻璃</title>
<style>
:root{
  --brand:#4F46E5; --brand-deep:#4338CA;
  --ink:#0F172A; --mute:#64748B;
  --canvas:#F6F7FB; --line:#E8EAF3;
  --sh1:0 1px 3px rgba(23,23,60,.06);
  --sh2:0 12px 32px rgba(60,60,160,.14),0 2px 8px rgba(60,60,160,.06);
  --grad:linear-gradient(92deg,#4F46E5 5%,#7C3AED 55%,#DB2777 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--canvas);color:var(--ink);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
.num{font-feature-settings:"tnum";letter-spacing:-.02em}
.gnum{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.wrap{max-width:1200px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:20px;font-weight:800;margin-bottom:6px}
.tip{font-size:13px;color:var(--mute);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.item{display:flex;flex-direction:column;gap:10px}
.badge{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.badge .k{flex:0 0 auto;font-size:12px;font-weight:800;color:#fff;background:var(--ink);padding:3px 9px;border-radius:7px}
.badge .t{font-size:12.5px;color:var(--mute)}
/* ===== 卡片基座（含 hover 顶部渐变条） ===== */
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:18px;min-height:148px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh1);overflow:hidden;
  transition:box-shadow .18s,transform .18s,border-color .18s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);
  opacity:0;transition:opacity .18s}
.card:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:#C9CDF7}
.card:hover::before{opacity:1}
.cnt{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--brand);background:#EEF0FF;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.name{font-weight:700;font-size:16.5px;line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{border:1.5px dashed #A5B4FC;background:#F5F6FF;color:#4338CA;padding:5px 12px;border-radius:9px;
  font-weight:700;font-size:13.5px;font-feature-settings:"tnum";white-space:nowrap}
/* ===== K1 徽章锚点卡 ===== */
.k1-top{display:flex;align-items:center;gap:11px}
.k1 .chip{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:17px;
  box-shadow:0 4px 10px rgba(90,60,220,.28)}
.k1 .name{flex:1;min-width:0}
.k1 .deal-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.k1 .lbl{font-size:12px;color:var(--mute)}
/* ===== K2 大金额主视觉卡 ===== */
.k2 .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.k2 .deal-hero{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.k2 .deal-hero .lbl{font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.k2 .deal-hero .row{display:flex;align-items:baseline;gap:7px}
.k2 .deal-hero b{font-size:27px;line-height:1.1}
.k2 .deal-hero .cond{font-size:12px;color:var(--mute)}
/* ===== K3 撕票线结构卡 ===== */
.k3 .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:13px}
.k3 .tear{border-top:2px dashed #C7CBF7;margin:0 -18px;position:relative}
.k3 .tear::before,.k3 .tear::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;
  background:var(--canvas);top:-9px}
.k3 .tear::before{left:-9px}.k3 .tear::after{right:-9px}
.k3 .deal-row{padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.k3 .lbl{font-size:12px;color:var(--mute)}
/* ===== K4 整宽票条卡 ===== */
.k4 .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.k4 .tk{margin-top:auto;position:relative;border:1.5px dashed #A5B4FC;background:#F5F6FF;
  border-radius:10px;padding:9px 12px;display:flex;align-items:baseline;justify-content:center;gap:7px}
.k4 .tk::before,.k4 .tk::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;
  background:var(--canvas);top:calc(50% - 7px)}
.k4 .tk::before{left:-8px}.k4 .tk::after{right:-8px}
.k4 .tk .lbl{font-size:11px;color:var(--brand-deep);opacity:.75}
.k4 .tk b{font-size:15px;font-weight:800;color:#4338CA;font-feature-settings:"tnum";letter-spacing:-.01em}
/* ===== K5 渐变底卡 ===== */
.k5{background:linear-gradient(135deg,#EEF0FF 0%,#FDF0F7 100%);border-color:#DFE2F6}
.k5 .cnt{background:#fff}
.k5 .tag{background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>首页分类卡片重新设计</h1>
  <p class="tip">同一张卡（开发板 · 3 张 · 满101减100），五种构图。悬停看效果，选定后回复编号（如「用 K2」），我更新主原型，全部定稿后再统一移植正式版。</p>
  <div class="grid">
    <div class="item">
      <button class="card k1">
        <div class="k1-top"><span class="chip">开</span><span class="name">开发板</span><span class="cnt">3 张</span></div>
        <div class="deal-row"><span class="lbl">最高优惠</span><span class="tag num">满101减100</span></div>
      </button>
      <div class="badge"><span class="k">K1 徽章锚点</span><span class="t">渐变首字方块做视觉锚点，卡片不再空、扫读有落点</span></div>
    </div>
    <div class="item">
      <button class="card k2">
        <div class="top"><span class="name">开发板</span><span class="cnt">3 张</span></div>
        <div class="deal-hero"><span class="lbl">最高优惠</span>
          <div class="row"><b class="gnum num">减 100</b><span class="cond">满 101 可用</span></div></div>
      </button>
      <div class="badge"><span class="k">K2 大金额主视觉</span><span class="t">去掉标签框，「减 100」大字做主角，金额层级最强</span></div>
    </div>
    <div class="item">
      <button class="card k3">
        <div class="top"><span class="name">开发板</span><span class="cnt">3 张</span></div>
        <div class="tear"></div>
        <div class="deal-row"><span class="lbl">最高优惠</span><span class="tag num">满101减100</span></div>
      </button>
      <div class="badge"><span class="k">K3 撕票线结构</span><span class="t">卡内虚线撕票线 + 两侧缺口，票签挂在票根区，券味最足</span></div>
    </div>
    <div class="item">
      <button class="card k4">
        <div class="top"><span class="name">开发板</span><span class="cnt">3 张</span></div>
        <div class="tk"><span class="lbl">最高优惠</span><b class="num">满101减100</b></div>
      </button>
      <div class="badge"><span class="k">K4 整宽票条</span><span class="t">满减值做成整宽票条（两端打孔、居中排版），像一张真券的票面</span></div>
    </div>
    <div class="item">
      <button class="card k5">
        <div class="top"><span class="name">开发板</span><span class="cnt">3 张</span></div>
        <div class="deal-row" style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span class="lbl" style="font-size:12px;color:var(--mute)">最高优惠</span><span class="tag num">满101减100</span></div>
      </button>
      <div class="badge"><span class="k">K5 渐变底卡</span><span class="t">靛蓝→粉的极淡渐变铺底，整卡更有玻璃感，与 Hero 呼应</span></div>
    </div>
  </div>
</div>
</body>
</html>
