<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>方向G · 高密度工作台风 · 立创优惠券</title>
<style>
:root{--brand:#2B6CFF;--bg:#F2F4F8;--surface:#FFFFFF;--text:#1D2534;--muted:#79839B;--border:#E3E8F0}
@media(prefers-color-scheme:dark){:root{--bg:#0E1218;--surface:#171E29;--text:#E4EBF3;--muted:#8B98AA;--border:#28303E}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:13px;line-height:1.45}
.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);
  padding:9px 12px;display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;height:34px;border:1px solid var(--border);border-radius:8px;
  padding:0 12px;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:.15s}
.bar input:focus{border-color:var(--brand);background:var(--surface)}
.bar select{height:34px;border:1px solid var(--border);border-radius:8px;background:var(--bg);
  color:var(--text);font-size:12.5px;padding:0 6px;outline:none;cursor:pointer;max-width:130px}
.bar select:focus{border-color:var(--brand)}
.meta{max-width:1280px;margin:0 auto;padding:10px 14px 0;font-size:12px;color:var(--muted)}
.meta b{color:var(--text)}
.grid{max-width:1280px;margin:0 auto;padding:10px 12px 60px;display:grid;gap:9px;
  grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 11px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.cell:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(20,40,90,.09);transform:translateY(-2px)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.c-brand{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-recv{font-size:10.5px;color:var(--muted);flex:0 0 auto}
.c-deal{font-size:17px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.c-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta2{margin-top:auto;height:30px;border:1px solid var(--brand);color:var(--brand);background:transparent;
  border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;
  display:flex;align-items:center;justify-content:center;transition:.15s;font-family:inherit}
.cta2:hover{background:var(--brand);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>
<div class="bar">
  <input id="q" placeholder="搜品牌 / 券名 / 分类…" autocomplete="off">
  <select id="cat"><option value="全部">全部分类</option></select>
  <select id="sort">
    <option value="hot">领取热度</option>
    <option value="amount">优惠力度</option>
    <option value="threshold">优惠后门槛</option>
  </select>
</div>
<div class="meta" id="meta">加载中…</div>
<main class="grid" id="list"></main>
<script src="sample_data.js"></script>
<script>
const D = window.SAMPLE_DATA;
const fmt = n => Number.isInteger(n) ? n : Number(n).toFixed(1);
const wan = n => n >= 10000 ? (n/10000).toFixed(1) + '万' : n;
let q = '', cat = '全部', sort = 'hot';
const catSel = document.getElementById('cat');
for (const c of Object.keys(D.categories)) {
  const o = document.createElement('option');
  o.value = c; o.textContent = `${c} (${(D.categories[c]||[]).length})`;
  catSel.appendChild(o);
}
catSel.addEventListener('change', e => { cat = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', e => { sort = e.target.value; render(); });
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('meta').innerHTML =
  `共 <b>${D.totalCoupons}</b> 张券 · <b>${D.totalCats}</b> 个分类 · 更新于 ${D.runTime}`;
function current(){
  let l = D.flat.filter(x => cat === '全部' || x.cats.includes(cat));
  if (q) l = l.filter(x => (x.brand_name||'').toLowerCase().includes(q)
    || (x.coupon_name||'').toLowerCase().includes(q) || x.cats.join(',').toLowerCase().includes(q));
  if (sort === 'amount') l = l.slice().sort((a,b) => b.coupon_amount - a.coupon_amount);
  else if (sort === 'threshold') l = l.slice().sort((a,b) => a.min_order_after_discount - b.min_order_after_discount);
  else l = l.slice().sort((a,b) => b.receive_customer_num - a.receive_customer_num);
  return l;
}
function render(){
  const l = current();
  document.getElementById('list').innerHTML = l.length ? l.map(x => `
    <article class="cell">
      <div class="c-top"><span class="c-brand">${x.brand_name}</span><span class="c-recv">已领${wan(x.receive_customer_num)}</span></div>
      <div class="c-deal">满${fmt(x.min_order_amount)}减${fmt(x.coupon_amount)}</div>
      <div class="c-sub">优惠后 ¥${fmt(x.min_order_after_discount)} · ${x.cats[0]}</div>
      <a class="cta2" target="_blank" rel="noopener" href="https://list.szlcsc.com/brand/${x.brand_id}.html">去领券</a>
    </article>`).join('') : '<div class="empty">没有匹配的券</div>';
}
render();
</script>
</body>
</html>
