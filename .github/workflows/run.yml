name: Deploy to GitHub Pages

on:
  schedule:
    # 北京时间每天 7:30 更新一次（UTC 23:30，GitHub Actions 按 UTC 调度）
    - cron: '30 23 * * *'
  push:
    branches:
      - master
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo lcsc.fdemo.com > html/CNAME
      - name: Run script to generate coupon_details.json
        run: python main.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install minification tools
        run: |
          npm install -g html-minifier-terser
          npm install -g clean-css-cli
          npm install -g terser

      - name: Minify HTML files
        run: |
          find html -name "*.html" -type f -exec html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-tag-whitespace \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            -o {}.min {} \; \
            -exec sh -c 'mv "$1.min" "$1"' _ {} \;

      - name: Minify CSS files
        run: |
          find html -name "*.css" -type f -exec cleancss -o {}.min {} \; \
          -exec sh -c 'mv "$1.min" "$1"' _ {} \;

      - name: Minify JavaScript files
        run: |
          find html -name "*.js" -type f -exec terser {} -c -m -o {}.min \; \
          -exec sh -c 'mv "$1.min" "$1"' _ {} \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: html/ # Directory containing your index.html and coupon_details.json
